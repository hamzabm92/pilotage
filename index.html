<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pilotage — Cockpit financier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F1;
    --ink: #1F1F1F;
    --ink-soft: #6b6b6b;
    --ink-faint: #c9c6bd;
    --pro: #2563EB;
    --perso: #7C3AED;
    --safe: #1F9D55;
    --watch: #F59E0B;
    --risk: #DC2626;
  }

  html, body {
    margin: 0; padding: 0;
    background: #e8e6e0;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  * { box-sizing: border-box; }

  #root {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.2);
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1F1F1F;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1F1F1F;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }

  /* Prevent blue highlight on tap */
  button, input, select { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- V1 App -->
  <script type="text/babel" src="src/store.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/auth.jsx"></script>
  <script type="text/babel" src="src/onboarding.jsx"></script>
  <script type="text/babel" src="src/cockpit.jsx"></script>
  <script type="text/babel" src="src/comptes.jsx"></script>
  <script type="text/babel" src="src/scenarios.jsx"></script>
  <script type="text/babel" src="src/objectifs.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
